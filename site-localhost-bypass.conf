# Bypass do Network App — expõe a porta 7443 direto para a UniFi Network
# Application (127.0.0.1:8081), pulando o SSO do UOS.
#
#   *** NÃO USAR EM PRODUÇÃO — NÃO EXPOR PUBLICAMENTE ***
#
# Isso contorna a autenticação SSO. Deve ficar vinculado apenas a localhost.
# Copiado para o lugar pelo uos-entrypoint.sh via hook de pre-start do unifi-core.

server {
    listen 7443 ssl http2;
    listen [::]:7443 ssl http2;
    server_name _;

    include /data/unifi-core/config/http/local-certs.conf;

    location / {
        proxy_pass http://127.0.0.1:8081/;
        proxy_redirect http://127.0.0.1/ https://$host:7443/;
        proxy_redirect http://$host/ https://$host:7443/;
        proxy_set_header Host $host:7443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 7443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-UI-Connection-Type local;
    }
}
